<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="shredGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Container -->
  <rect x="10" y="10" width="780" height="220" rx="16" fill="url(#pBg)" stroke="#1f2937" stroke-width="1.5"/>

  <!-- Header -->
  <text x="35" y="42" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="15" font-weight="800" fill="#f9fafb">🔒 ZERO-FOOTPRINT EPHEMERAL PRIVACY LIFECYCLE</text>
  <text x="35" y="62" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500" fill="#9ca3af">Customer documents are processed locally and permanently unlinked after release</text>

  <!-- Step 1: Upload -->
  <g transform="translate(35, 85)">
    <rect x="0" y="0" width="150" height="115" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
    <text x="75" y="32" font-size="22" text-anchor="middle">📱</text>
    <text x="75" y="58" font-family="sans-serif" font-size="13" font-weight="700" fill="#f3f4f6" text-anchor="middle">1. Mobile Upload</text>
    <text x="75" y="78" font-family="sans-serif" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Local encrypted tunnel</text>
    <text x="75" y="94" font-family="sans-serif" font-size="10" font-weight="600" fill="#60a5fa" text-anchor="middle">Zero Cloud S3 / DB</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(195, 132)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#4b5563" stroke-width="2" stroke-dasharray="4"/>
    <polygon points="25,-4 32,0 25,4" fill="#9ca3af"/>
  </g>

  <!-- Step 2: Spooler -->
  <g transform="translate(235, 85)">
    <rect x="0" y="0" width="150" height="115" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
    <text x="75" y="32" font-size="22" text-anchor="middle">⚡</text>
    <text x="75" y="58" font-family="sans-serif" font-size="13" font-weight="700" fill="#f3f4f6" text-anchor="middle">2. GDI Spooler</text>
    <text x="75" y="78" font-family="sans-serif" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">In-Memory rendering</text>
    <text x="75" y="94" font-family="sans-serif" font-size="10" font-weight="600" fill="#34d399" text-anchor="middle">300 DPI Native DC</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(395, 132)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#4b5563" stroke-width="2" stroke-dasharray="4"/>
    <polygon points="25,-4 32,0 25,4" fill="#9ca3af"/>
  </g>

  <!-- Step 3: Paper Print -->
  <g transform="translate(435, 85)">
    <rect x="0" y="0" width="150" height="115" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
    <text x="75" y="32" font-size="22" text-anchor="middle">🖨️</text>
    <text x="75" y="58" font-family="sans-serif" font-size="13" font-weight="700" fill="#f3f4f6" text-anchor="middle">3. Paper Release</text>
    <text x="75" y="78" font-family="sans-serif" font-size="10" font-weight="500" fill="#9ca3af" text-anchor="middle">Physical tray output</text>
    <text x="75" y="94" font-family="sans-serif" font-size="10" font-weight="600" fill="#fbbf24" text-anchor="middle">Cash Confirmed Lock</text>
  </g>

  <!-- Arrow 3 -->
  <g transform="translate(595, 132)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#10b981" stroke-width="2" stroke-dasharray="3"/>
    <polygon points="25,-4 32,0 25,4" fill="#10b981"/>
  </g>

  <!-- Step 4: 60s Shred -->
  <g transform="translate(630, 85)">
    <rect x="0" y="0" width="135" height="115" rx="12" fill="url(#shredGrad)" stroke="#059669" stroke-width="1"/>
    <text x="67" y="32" font-size="22" text-anchor="middle">✂️</text>
    <text x="67" y="58" font-family="sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4. Auto-Purge</text>
    <text x="67" y="78" font-family="sans-serif" font-size="10" font-weight="600" fill="#d1fae5" text-anchor="middle">60-Sec Countdown</text>
    <text x="67" y="94" font-family="sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">0 KB on Disk</text>
  </g>
</svg>