<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 290" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="fastGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="slowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="10" y="10" width="780" height="270" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Title & Subtitle -->
  <text x="35" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">⚡ REAL-WORLD COUNTER SPEED BENCHMARK</text>
  <text x="35" y="68" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Average walk-in customer turnaround time during rush hours</text>

  <!-- Row 1: Traditional WhatsApp -->
  <g transform="translate(35, 95)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#fda4af">❌ Traditional WhatsApp Printing</text>
    <text x="710" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#fda4af" text-anchor="end">~210s (3.5 mins)</text>
    
    <!-- Background Track -->
    <rect x="0" y="26" width="710" height="28" rx="8" fill="#1e1b4b" stroke="#312e81" stroke-width="1"/>
    <!-- Fill Bar (100% width) -->
    <rect x="0" y="26" width="710" height="28" rx="8" fill="url(#slowGrad)"/>
    <!-- Steps Inside Bar -->
    <text x="15" y="45" font-family="sans-serif" font-size="11" font-weight="600" fill="#ffffff">Ask Number ➔ Save Contact ➔ Chat Wait ➔ Download to Desktop ➔ Open Adobe ➔ Print Dialog</text>
  </g>

  <!-- Row 2: DropPrint Express -->
  <g transform="translate(35, 175)">
    <text x="0" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7">⚡ DropPrint Self-Service Counter</text>
    <text x="710" y="16" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="800" fill="#34d399" text-anchor="end">~20s (6x Faster!)</text>
    
    <!-- Background Track -->
    <rect x="0" y="26" width="710" height="28" rx="8" fill="#064e3b" stroke="#047857" stroke-width="1"/>
    <!-- Fill Bar (Fast: ~18% width) -->
    <rect x="0" y="26" width="145" height="28" rx="8" fill="url(#fastGrad)"/>
    <!-- Highlight Badge -->
    <text x="15" y="45" font-family="sans-serif" font-size="11" font-weight="700" fill="#ffffff">Scan QR ➔ 1-Click Print</text>
    <!-- Remaining Track Note -->
    <text x="160" y="45" font-family="sans-serif" font-size="11" font-weight="600" fill="#34d399">⚡ 190 Seconds Saved Per Customer • Zero Counter Line Queue</text>
  </g>

  <!-- Bottom Metric Highlights -->
  <g transform="translate(35, 252)">
    <text x="0" y="0" font-family="sans-serif" font-size="11" font-weight="600" fill="#64748b">📊 Impact:</text>
    <text x="65" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">100+ Walk-in Customers/Hour Capacity</text>
    <text x="360" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">• 0 Unknown Numbers Saved</text>
    <text x="560" y="0" font-family="sans-serif" font-size="11" font-weight="700" fill="#38bdf8">• 0 WhatsApp File Clutter</text>
  </g>
</svg>